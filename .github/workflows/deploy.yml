name: Build & Deploy to EC2 Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskflow
  INSTANCE_ID: i-00cece76df20c1e36
  TARGET_PORT: 80
  PUBLIC_URL: http://3.109.24.233

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          echo "Building Docker image from context ${{ github.workspace }}"
          docker build \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            .
          echo "Pushing images to ECR..."
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "Image built and pushed: $FULL_IMAGE:latest"

      - name: Build diagnostics
        run: |
          echo "=== Docker image info ==="
          docker images --filter "reference=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          echo "=== Image URI ==="
          echo "${{ steps.build-image.outputs.image_uri }}"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          IMAGE_URI="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="${{ env.TARGET_PORT }}"

          # Verify instance is running; resolve by tag if needed
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text 2>/dev/null || echo "stopped")

          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID not running. Attempting to resolve by tag..."
            RESOLVED_ID=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters "Name=tag:Name,Values=taskflow-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "Resolved to running instance: $INSTANCE_ID"
            else
              echo "ERROR: No running instance found. Aborting deployment."
              exit 1
            fi
          fi

          # Get secrets from AWS Secrets Manager
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "deptic/TASKFLOW/secrets" \
            --region "$REGION" \
            --query SecretString \
            --output text 2>/dev/null || echo '{}')
          MONGODB_URI=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('MONGODB_URI', ''))" 2>/dev/null || echo "")
          JWT_SECRET=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('JWT_SECRET', ''))" 2>/dev/null || echo "")

          # Write SSM command payload to file to avoid shell parsing issues
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "REPO=taskflow",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/taskflow:latest",
              "MONGODB_URI__PLACEHOLDER=replace_me",
              "JWT_SECRET__PLACEHOLDER=replace_me",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:80 -e MONGODB_URI=\"$MONGODB_URI__PLACEHOLDER\" -e JWT_SECRET=\"$JWT_SECRET__PLACEHOLDER\" $IMAGE_URI",
              "docker system prune -f --filter 'until=24h' || true"
            ]
          }
          SSMPARAMS

          # Inject actual secrets into the params file
          python3 << 'PYEOF'
          import json
          with open('/tmp/ssm-params.json', 'r') as f:
              params = json.load(f)
          commands = params["commands"]
          mongodb_uri = """$MONGODB_URI"""
          jwt_secret = """$JWT_SECRET"""
          for i, cmd in enumerate(commands):
              if "MONGODB_URI__PLACEHOLDER=replace_me" in cmd:
                  commands[i] = f"MONGODB_URI__PLACEHOLDER={mongodb_uri}"
              if "JWT_SECRET__PLACEHOLDER=replace_me" in cmd:
                  commands[i] = f"JWT_SECRET__PLACEHOLDER={jwt_secret}"
              commands[i] = commands[i].replace("$MONGODB_URI__PLACEHOLDER", mongodb_uri).replace("$JWT_SECRET__PLACEHOLDER", jwt_secret)
          params["commands"] = commands
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(params, f)
          PYEOF

          echo "Sending SSM command to instance $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete
          sleep 15

          # Check command status
          CMD_STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "CommandInvocations[0].Status" \
            --output text)

          echo "SSM command status: $CMD_STATUS"

          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" || true

          if [ "$CMD_STATUS" != "Success" ]; then
            echo "ERROR: SSM command failed with status: $CMD_STATUS"
            exit 1
          fi

          echo "Deployment via SSM completed successfully"

      - name: Health check
        run: |
          echo "Waiting for application to be ready..."
          sleep 10

          HTTP_CODE=0
          MAX_RETRIES=12
          RETRY_COUNT=0

          while [ $HTTP_CODE -ne 200 ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.PUBLIC_URL }}" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES: HTTP $HTTP_CODE, retrying in 10 seconds..."
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT+1))
            fi
          done

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed: HTTP 200 OK from ${{ env.PUBLIC_URL }}"
          else
            echo "Health check failed after $MAX_RETRIES attempts"
            echo "Last HTTP code: $HTTP_CODE"
            curl -v "${{ env.PUBLIC_URL }}" 2>&1 || true
            exit 1
          fi

      - name: Verify running container on EC2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Verify container is running via SSM
          cat > /tmp/ssm-verify.json << 'EOF'
          {
            "commands": [
              "docker ps --filter name=app --format '{{.Names}} {{.Status}} {{.Ports}}'",
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:80"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-verify.json \
            --query "Command.CommandId" \
            --output text)

          sleep 10

          echo "=== Container verification output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text || true

          echo "=== Deployment completed successfully ==="