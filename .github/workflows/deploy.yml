name: Build, Deploy & Verify to EC2 Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskflow
  INSTANCE_ID: i-023481b86999aeb33
  PUBLIC_URL: http://35.154.173.36

jobs:
  build-and-deploy:
    name: Build, Push, Deploy, and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS CLI credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = ${{ env.AWS_REGION }}
          output = json
          EOF

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "Building $FULL_IMAGE:latest from context ."
          docker build \
            --tag "$FULL_IMAGE:$IMAGE_TAG" \
            --tag "$FULL_IMAGE:latest" \
            .
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify Docker image (build diagnostics)
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "### Image verification ###"
          docker run --rm --entrypoint sh "$FULL_IMAGE" -c "
            echo 'Image built successfully';
            echo '--- Frontend assets ---';
            ls -la /usr/share/nginx/html/ 2>/dev/null || echo 'warning: frontend build output not found';
            echo '--- Node.js version ---';
            node --version;
            echo '--- Backend server.js exists? ---';
            test -f /usr/src/app/server.js && echo 'yes' || echo 'no';
          "

      - name: Deploy to EC2 via SSM
        env:
          FULL_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          IMAGE_URI="$FULL_IMAGE"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"

          # Verify target instance is running; fallback to tag-based resolution
          if ! aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=taskflow-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "Resolved running instance: $INSTANCE_ID"
            else
              echo "ERROR: No running EC2 instance found (tried $INSTANCE_ID and tag:taskflow-server)"
              exit 1
            fi
          fi

          # Write SSM command payload and send it
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e MONGODB_URI=$MONGODB_URI -e JWT_SECRET=$JWT_SECRET $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent: $COMMAND_ID"
          echo "Waiting for command to complete..."
          sleep 15

      - name: Health check
        run: |
          echo "Performing health check against ${{ env.PUBLIC_URL }}/api/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 "${{ env.PUBLIC_URL }}/api/health" || echo "000")
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Health check passed — API is responding."