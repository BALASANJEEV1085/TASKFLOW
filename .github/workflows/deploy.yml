name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskflow
  INSTANCE_ID: i-00cece76df20c1e36
  AWS_ACCOUNT_ID: "759204735992"
  TARGET_PORT: "80"

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          set -e
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        run: |
          set -e
          FULL_IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          echo "Building $FULL_IMAGE:latest from context: ${{ env.DOCKERFILE_PATH || '.' }}"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="${{ env.AWS_DEFAULT_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com"
          REPO="${{ env.ECR_REPOSITORY }}"
          IMAGE_URI="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="${{ env.TARGET_PORT }}"

          # Resolve active instance if the hardcoded one is not running
          INSTANCE_STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null || echo "stopped")
          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID not running. Attempting to resolve by tag..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" --filters "Name=tag:Name,Values=taskflow-server" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "Resolved to running instance: $INSTANCE_ID"
            else
              echo "ERROR: No running instance found. Aborting deployment."
              exit 1
            fi
          fi

          # Get secrets from AWS Secrets Manager
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "deptic/TASKFLOW/secrets" --region "$REGION" --query SecretString --output text 2>/dev/null || echo '{}')
          MONGODB_URI=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('MONGODB_URI', ''))" 2>/dev/null || echo "")
          JWT_SECRET=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('JWT_SECRET', ''))" 2>/dev/null || echo "")

          # Write SSM command payload to file
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/taskflow:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e MONGODB_URI='$MONGODB_URI' -e JWT_SECRET='$JWT_SECRET' 759204735992.dkr.ecr.ap-south-1.amazonaws.com/taskflow:latest"
            ]
          }
          SSMPARAMS

          # Substitute secrets using Python to avoid shell escaping issues
          python3 << 'PYTHON_SCRIPT'
          import json, os

          with open('/tmp/ssm-params.json', 'r') as f:
              params = json.load(f)

          mongodb_uri = os.environ.get('MONGODB_URI', '')
          jwt_secret = os.environ.get('JWT_SECRET', '')

          # Replace placeholders in the commands
          for i, cmd in enumerate(params['commands']):
              params['commands'][i] = cmd.replace('$MONGODB_URI', mongodb_uri).replace('$JWT_SECRET', jwt_secret)

          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(params, f)

          print("SSM parameters written successfully")
          PYTHON_SCRIPT

          # Send command to EC2
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent: $COMMAND_ID"

          # Wait for SSM command to complete
          echo "Waiting for SSM command to complete..."
          sleep 30

          # Get command output
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" \
            --output text

          echo "Deployment command executed successfully"

      - name: Verify deployment health
        run: |
          set -e
          PUBLIC_IP="3.109.24.233"
          HEALTH_URL="http://$PUBLIC_IP/api/health"
          echo "Checking health endpoint: $HEALTH_URL"
          MAX_RETRIES=12
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed! (HTTP $HTTP_STATUS) on attempt $i"
              curl -s "$HEALTH_URL" | python3 -m json.tool || true
              exit 0
            elif [ "$HTTP_STATUS" -eq 000 ]; then
              echo "Attempt $i/$MAX_RETRIES: Server not reachable yet, retrying in ${RETRY_DELAY}s..."
            else
              echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
            fi
            sleep $RETRY_DELAY
          done
          echo "ERROR: Health check failed after $MAX_RETRIES attempts"
          curl -v "$HEALTH_URL" 2>&1 || true
          exit 1