name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskflow
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-023481b86999aeb33
  CONTAINER_PORT: 80
  PUBLIC_URL: http://35.154.173.36

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "Building $FULL_IMAGE:latest from context: ."
          docker build --tag "$FULL_IMAGE:$IMAGE_TAG" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          FULL_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          IMAGE_URI="$FULL_IMAGE"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"

          # Use resolved instance if provided instance is not running
          if ! aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=taskflow-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "Resolved running instance: $INSTANCE_ID"
            else
              echo "ERROR: No running instance found"
              exit 1
            fi
          fi

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ],
            "executionTimeout": ["300"]
          }
          SSMPARAMS

          # Replace variables inside the JSON since shell heredoc doesn't expand
          sed -i "s|\$REGION|$REGION|g; s|\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\$IMAGE_URI|$IMAGE_URI|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent: $COMMAND_ID"

          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed"
              exit 1
            fi
            sleep 10
          done

      - name: Health Check
        run: |
          echo "Waiting for container to be healthy..."
          sleep 15
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${{ env.PUBLIC_URL }}/api/health" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              echo "Application is live at ${{ env.PUBLIC_URL }}"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after all attempts"
          exit 1