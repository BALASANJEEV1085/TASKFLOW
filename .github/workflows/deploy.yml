name: Build & Deploy to EC2 Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskflow
  INSTANCE_ID: i-00cece76df20c1e36
  TARGET_PORT: 80
  PUBLIC_URL: http://3.109.24.233

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          echo "Building Docker image from context ${{ github.workspace }}"
          docker build \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            .
          echo "Pushing images to ECR..."
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "Image built and pushed: $FULL_IMAGE:latest"

      - name: Build diagnostics
        run: |
          echo "=== Docker image info ==="
          docker images --filter "reference=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          echo "=== Image URI ==="
          echo "${{ steps.build-image.outputs.image_uri }}"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          IMAGE_URI="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="${{ env.TARGET_PORT }}"

          # Verify instance is running; resolve by tag if needed
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text 2>/dev/null || echo "stopped")

          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID not running. Attempting to resolve by tag..."
            RESOLVED_ID=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters "Name=tag:Name,Values=taskflow-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "Resolved to running instance: $INSTANCE_ID"
            else
              echo "No running instance found. Starting instance..."
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "$REGION" > /dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "$REGION"
              echo "Instance $INSTANCE_ID is now running"
            fi
          fi

          # Write SSM command to JSON file to avoid shell parsing bugs
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          # Inject runtime variables into the JSON using jq
          apt-get update -qq && apt-get install -y -qq jq > /dev/null 2>&1
          jq --arg REGION "$REGION" \
             --arg ECR_REGISTRY "$ECR_REGISTRY" \
             --arg IMAGE_URI "$IMAGE_URI" \
             '.commands[0] |= gsub("\\$REGION"; $REGION) | .commands[0] |= gsub("\\$ECR_REGISTRY"; $ECR_REGISTRY) | .commands[1] |= gsub("\\$IMAGE_URI"; $IMAGE_URI) | .commands[4] |= gsub("\\$IMAGE_URI"; $IMAGE_URI)' \
             /tmp/ssm-params.json > /tmp/ssm-params-resolved.json

          echo "Sending SSM command to $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params-resolved.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --region "$REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Command status: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 10
          done

          # Show output
          aws ssm list-command-invocations \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" \
            --output text || echo "No output available"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully"

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 15

          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PUBLIC_URL }} || echo "000")
            echo "Attempt $i: HTTP status $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! Application is running at ${{ env.PUBLIC_URL }}"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed after 12 attempts"
          curl -v ${{ env.PUBLIC_URL }} || true
          exit 1