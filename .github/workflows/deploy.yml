name: Build and Deploy TaskFlow to EC2/Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskflow
  INSTANCE_ID: i-00cece76df20c1e36
  PUBLIC_URL: http://3.109.24.233
  DETECTED_PORT: 80

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build diagnostics
        run: |
          echo "=== Repository Structure ==="
          ls -la
          echo "=== Backend package.json ==="
          cat backend/package.json
          echo "=== Frontend package.json ==="
          cat frontend/package.json
          echo "=== Server entry point ==="
          head -20 backend/server.js
          echo "=== Dockerfile check ==="
          if [ -f Dockerfile ]; then echo "Dockerfile exists"; else echo "WARNING: No Dockerfile found at root"; fi

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'AWSCONFIG'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region = ${{ env.AWS_REGION }}
          AWSCONFIG

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "Logged in to ECR successfully"

      - name: Build and tag Docker image
        id: build-image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="latest-${SHORT_SHA}-$(date +%s)"
          FULL_IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          docker build \
            --build-arg NODE_ENV=production \
            --build-arg PORT=${{ env.DETECTED_PORT }} \
            -t $FULL_IMAGE_URI .

          echo "Image built: ${FULL_IMAGE_URI}"
          echo "image_uri=${FULL_IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          docker push "${IMAGE_URI}"
          echo "Image pushed: ${IMAGE_URI}"

      - name: Retrieve secrets from AWS Secrets Manager
        id: get-secrets
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id deptic/TASKFLOW/secrets \
            --region ${{ env.AWS_REGION }} \
            --query SecretString \
            --output text)

          echo "Secrets retrieved successfully"
          echo "::set-output name=secret_json::${SECRET_JSON}"

      - name: Prepare SSM deployment parameters
        id: ssm-params
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          SECRETS_JSON='${{ steps.get-secrets.outputs.secret_json }}'

          JWT_SECRET=$(echo "$SECRETS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('JWT_SECRET','default-jwt-secret'))")
          MONGODB_URI=$(echo "$SECRETS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('MONGODB_URI','mongodb://localhost:27017/taskflow'))")

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull IMAGE_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET=JWT_PLACEHOLDER -e MONGODB_URI=MONGODB_PLACEHOLDER IMAGE_PLACEHOLDER"
            ]
          }
          SSMPARAMS

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" /tmp/ssm-params.json
          sed -i "s|JWT_PLACEHOLDER|$JWT_SECRET|g" /tmp/ssm-params.json
          sed -i "s|MONGODB_PLACEHOLDER|$MONGODB_URI|g" /tmp/ssm-params.json

          echo "SSM parameters prepared"

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          TIMEOUT=120
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query "CommandInvocations[0].Status" \
              --output text)

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 15

          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.PUBLIC_URL }}/api/health || echo "000")
            echo "Attempt $i: HTTP status code $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! Application is running."
              curl -s --max-time 10 ${{ env.PUBLIC_URL }}/api/health | head -c 500
              echo ""
              exit 0
            fi

            if [ "$i" -lt 6 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

          echo "Health check failed after multiple retries"
          exit 1